<div id="welcome" class="welcome"><div class="welcome-bg"><img src="assets/home.jpg" alt=""></div><div class="welcome-card"><h1>MY FREEDOM PLAN</h1><p>ซื้อเวลาให้ตัวเอง ✈️<br>วางแผนเงินวันนี้ เพื่อมีเวลาใช้ชีวิตในแบบที่อยากได้</p><button class="btn" id="startBtn">Get Started</button></div></div>
<script>
const KEY='myFreedomPlanV4';
const INVEST_ZERO_MIGRATION='mfp_invest_zero_v48_1';
const defaultState={version:4.81,profile:{name:'Frame',age:29,retirementAge:45},goal:{monthlySpendUSD:2000,withdrawalRate:4},funds:{etfUSD:0,reserveEUR:3200,happyTHB:12500,travelTHB:0,shoppingTHB:0},dca:{monthlyUSD:200,increaseUSD:100},vacationDays:7,monthBudgetTHB:0,fx:{USDTHB:34.2,EURTHB:37.6},etfs:[{symbol:'VOO',pct:0,value:0},{symbol:'VT',pct:0,value:0},{symbol:'QQQM',pct:0,value:0},{symbol:'SCHD',pct:0,value:0},{symbol:'Other',pct:0,value:0}],transactions:[],travelGoals:[],settings:{onboarded:false,currency:'THB'}};
let state=load();let active='home';
function clone(x){return JSON.parse(JSON.stringify(x))}
function merge(base,x){const out=clone(base);for(const k in (x||{})){if(x[k]&&typeof x[k]==='object'&&!Array.isArray(x[k])&&out[k])out[k]=merge(out[k],x[k]);else out[k]=x[k]}return out}
function normalizeInvestmentData(m){
  m.etfs=(Array.isArray(m.etfs)&&m.etfs.length?m.etfs:clone(defaultState.etfs)).map(e=>({symbol:String(e.symbol||'Other'),pct:Number(e.pct||0),value:Number(e.value||0)}));
  const total=m.etfs.reduce((a,e)=>a+Number(e.value||0),0);
  m.funds.etfUSD=total;
  m.etfs=m.etfs.map(e=>({...e,pct:total?Number(((e.value/total)*100).toFixed(1)):0}));
  return m;
}
function resetInvestmentToZero(m){
  m.funds.etfUSD=0;
  m.etfs=clone(defaultState.etfs);
  return m;
}
function applyOneTimeInvestmentReset(m){
  if(localStorage.getItem(INVEST_ZERO_MIGRATION)!=='1'){
    resetInvestmentToZero(m);
    localStorage.setItem(INVEST_ZERO_MIGRATION,'1');
  }
  return m;
}
function load(){try{const cur=JSON.parse(localStorage.getItem(KEY));if(cur){return normalizeInvestmentData(applyOneTimeInvestmentReset(merge(defaultState,cur)));}const v3=JSON.parse(localStorage.getItem('myFreedomPlanV3'));if(v3){const m=merge(defaultState,v3);m.settings.onboarded=true;return normalizeInvestmentData(applyOneTimeInvestmentReset(m))}const v2=JSON.parse(localStorage.getItem('mfp-v2'));if(v2){const m=clone(defaultState);m.funds.etfUSD=Number(v2.etf)||0;m.funds.reserveEUR=Number(v2.reserve)||0;m.funds.happyTHB=Number(v2.happy)||0;m.funds.travelTHB=Number(v2.travel)||0;m.goal.monthlySpendUSD=Number(v2.settings?.monthly)||2000;m.profile.age=Number(v2.settings?.age)||29;m.profile.retirementAge=Number(v2.settings?.retireAge)||45;m.dca.monthlyUSD=Number(v2.settings?.dca)||200;m.dca.increaseUSD=Number(v2.settings?.dcaIncrease)||100;m.settings.onboarded=true;return normalizeInvestmentData(applyOneTimeInvestmentReset(m))}return applyOneTimeInvestmentReset(clone(defaultState))}catch(e){return clone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n,c='$'){return `${c}${Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}`}
function thb(n){return `฿${Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}`}
function eur(n){return `€${Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}`}
function freedomTarget(){return state.goal.monthlySpendUSD*12/(state.goal.withdrawalRate/100)}
function freedomPct(){return Math.min(100,state.funds.etfUSD/freedomTarget()*100)}
function monthsFreedom(){return state.goal.monthlySpendUSD?state.funds.etfUSD/state.goal.monthlySpendUSD:0}
function projectedAtRetirement(){let age=Number(state.profile.age)||29,ret=Math.max(age,Number(state.profile.retirementAge)||45),years=ret-age,r=.07,bal=Number(state.funds.etfUSD)||0,con=Number(state.dca.monthlyUSD)||0,inc=Number(state.dca.increaseUSD)||0;for(let y=0;y<years;y++){for(let m=0;m<12;m++)bal=bal*(1+r/12)+con;con+=inc}return{bal,years,con0:Number(state.dca.monthlyUSD)||0,inc}}
function thisMonth(){return new Date().toISOString().slice(0,7)}
function txMonth(type){return state.transactions.filter(t=>t.date?.slice(0,7)===thisMonth()&&(type?t.type===type:true)).reduce((s,t)=>s+Number(t.amount||0),0)}

pan>${money(freedomTarget())}</span></div><div class=\"card\"><div class=\"line\"><span>Monthly retirement spending</span><b>${money(state.goal.monthlySpendUSD)}</b></div><div class=\"line\"><span>Target retirement age</span><b>${state.profile.retirementAge}</b></div><div class=\"bar\"><div class=\"fill\" style=\"width:${p}%\"></div></div><div class=\"tiny\">${p.toFixed(1)}% toward your current freedom target.</div></div><div class=\"section-head\"><h2>Retirement Projection</h2><span>illustrative</span></div><div class=\"card\"><div class=\"line\"><span>Estimated at age ${state.profile.retirementAge}</span><b>${money(proj.bal)}</b></div><div class=\"line\"><span>DCA now</span><b>${money(proj.con0)}/mo</b></div><div class=\"line\"><span>Annual DCA increase</span><b>${money(proj.inc)}/mo</b></div><div class=\"tiny\">Illustration only: 7% annual return assumption. Returns are not guaranteed.</div></div>`}

function render(){['home','money','invest','life','more'].forEach(id=>document.getElementById(id).classList.toggle('active',id===active));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));renderHome();renderMoney();renderInvest();renderLife();renderMore();document.querySelectorAll('.ni').forEach(el=>el.innerHTML=ico(el.dataset.icon));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===active))}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalWrap').classList.add('show')}
function closeModal(){document.getElementById('modalWrap').classList.remove('show')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
function openTx(type){openModal(`<button class="close" onclick="closeModal()">×</button><h3>${type==='income'?'Add Income':'Add Expense'}</h3><div class="formgrid"><div class="field"><label>Amount (THB)</label><input id="txAmount" type="number" inputmode="decimal" placeholder="0"></div><div class="field"><label>Date</label><input id="txDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Category</label><select id="txCat"><option>Salary</option><option>Business</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Travel</option><option>Other</option></select></div><div class="field"><label>Note</label><input id="txNote" placeholder="Optional note"></div><button class="btn" onclick="saveTx('${type}')">Save</button>`)}
function saveTx(type){const a=Number(document.getElementById('txAmount').value);if(!a)return toast('กรุณาใส่จำนวนเงิน');state.transactions.push({id:Date.now(),type,amount:a,date:document.getElementById('txDate').value,category:document.getElementById('txCat').value,note:document.getElementById('txNote').value});save();closeModal();render();toast('บันทึกแล้ว ✓')}
function openContribution(){const opts=state.etfs.map(e=>`<option value=\"${esc(e.symbol)}\">${esc(e.symbol)}</option>`).join('');openModal(`<button class=\"close\" onclick=\"closeModal()\">×</button><h3>Investment Contribution</h3><div class=\"field\"><label>Amount (USD)</label><input id=\"cAmt\" type=\"number\" min=\"0\" placeholder=\"0\"></div><div class=\"field\"><label>ETF</label><select id=\"cEtf\" onchange=\"toggleNewEtf()\">${opts}<option value=\"__new__\">＋ Add new ETF</option></select></div><div class=\"field hidden\" id=\"newEtfWrap\"><label>New ETF symbol</label><input id=\"newEtf\" maxlength=\"10\" placeholder=\"e.g. VTI\"></div><div class=\"field\"><label>Note</label><input id=\"cNote\" value=\"DCA\"></div><button class=\"btn\" onclick=\"saveContribution()\">Save Contribution</button>`)}
function toggleNewEtf(){const el=document.getElementById('newEtfWrap');if(el)el.classList.toggle('hidden',document.getElementById('cEtf').value!=='__new__')}
function saveContribution(){const a=Number(document.getElementById('cAmt').value);if(!(a>0))return toast('กรุณาใส่จำนวนเงินที่มากกว่า 0');let sym=document.getElementById('cEtf').value;if(sym==='__new__'){sym=String(document.getElementById('newEtf').value||'').trim().toUpperCase();if(!sym)return toast('กรุณาใส่ชื่อ ETF');if(!state.etfs.some(e=>e.symbol===sym))state.etfs.push({symbol:sym,pct:0,value:0});}const e=state.etfs.find(x=>x.symbol===sym);if(!e)return toast('ไม่พบ ETF');e.value=Number(e.value||0)+a;state.funds.etfUSD=state.etfs.reduce((sum,x)=>sum+Number(x.value||0),0);state.etfs=state.etfs.map(x=>({...x,pct:state.funds.etfUSD?Number(((x.value/state.funds.etfUSD)*100).toFixed(1)):0}));save();closeModal();render();toast('Contribution added ✓')}
function openTravel(){const g=state.travelGoals[0]||{};openModal(`<button class="close" onclick="closeModal()">×</button><h3>Travel Goal</h3><div class="field"><label>Destination</label><input id="gName" value="${esc(g.name||'Greece')}"></div><div class="formgrid"><div class="field"><label>Target (THB)</label><input id="gTarget" type="number" value="${g.targetTHB||200000}"></div><div class="field"><label>Saved (THB)</label><input id="gSaved" type="number" value="${g.savedTHB||0}"></div></div><div class="field"><label>Target date</label><input id="gDate" type="month" value="${g.targetDate||'2027-05'}"></div><button class="btn" onclick="saveTravel()">Save</button>`)}

function openCurrency(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Currency & FX</h3><div class="field"><label>Default display</label><select id="cur"><option ${state.settings.currency==='THB'?'selected':''}>THB</option><option ${state.settings.currency==='USD'?'selected':''}>USD</option><option ${state.settings.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="formgrid"><div class="field"><label>1 USD = THB</label><input id="fxu" type="number" step="0.01" value="${state.fx.USDTHB}"></div><div class="field"><label>1 EUR = THB</label><input id="fxe" type="number" step="0.01" value="${state.fx.EURTHB}"></div></div><button class="btn" onclick="state.settings.currency=document.getElementById('cur').value;state.fx.USDTHB=Number(document.getElementById('fxu').value);state.fx.EURTHB=Number(document.getElementById('fxe').value);save();closeModal();render();toast('Currency saved ✓')">Save</button>`)}
function openBackup(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Backup / Restore</h3><p class="tiny">Export your full plan to a JSON file and keep it in iCloud Drive or Google Drive.</p><button class="btn" onclick="exportData()">Export Backup</button><div style="height:8px"></div><label class="btn secondary" style="display:block;text-align:center">Import Backup<input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></label>`)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`my-freedom-plan-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup exported ✓')}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=merge(defaultState,JSON.parse(r.result));state.settings.onboarded=true;save();closeModal();render();toast('Backup restored ✓')}catch(e){toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}
function openSettings(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Settings</h3><div class="card"><div class="line"><span>App version</span><b>V4.8.1</b></div><div class="line"><span>Storage</span><b>Local device</b></div><div class="line"><span>Data sync</span><b>Backup manually</b></div></div><button class="btn danger" onclick="if(confirm('Reset all data?')){localStorage.removeItem(KEY);state=clone(defaultState);state.settings.onboarded=true;save();closeModal();render();toast('Reset complete')}">Reset App Data</button>`)}
function openAbout(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>My Freedom Plan V4.8.1 iPhone</h3><p class="tiny">A personal life-planning PWA built around one idea: your money should buy you more choices, time and freedom.</p><div class="card"><b>Design system</b><p class="tiny">Real illustration assets + HTML UI. No CSS characters. The five illustrated scenes are independent assets so the interface stays editable and functional.</p></div><button class="btn secondary" onclick="closeModal()">Done</button>`)}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})}));
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});
document.getElementById('startBtn').addEventListener('click',()=>{state.settings.onboarded=true;save();document.getElementById('welcome').classList.remove('show');render()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();if(!state.settings.onboarded)document.getElementById('welcome').classList.add('show');
</script>
</body>
</html>
